[package]
name = "qemu-admin-desktop"
version = "0.1.0"
description = "QEMU Admin — gerenciador de máquinas virtuais QEMU"
authors = ["QEMU Admin"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
# Used by `tauri build --debug` and by `cargo build` in debug profile.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
